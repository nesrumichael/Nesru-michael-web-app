<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Nesru Michael — Social Feed, Friends & Live Chat</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding-bottom: 76px;
    }
    .hidden { display: none !important; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #0f172a;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { font-weight: 800; font-size: 16px; letter-spacing: 0.2px; }
    .badge {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      font-weight: 700;
    }
    .badge-cloud { background: #16a34a; color: #fff; }
    .badge-local { background: #f59e0b; color: #0f172a; }

    .container { max-width: 720px; margin: 0 auto; padding: 14px; }
    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .muted { color: #64748b; font-size: 13px; }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    textarea { min-height: 84px; resize: vertical; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-outline { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    .auth-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .auth-tabs .btn { flex: 1; justify-content: center; }
    .auth-tabs .btn.active { background: #0f172a; color: #fff; }

    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .filter-btns { display: flex; gap: 6px; }
    .filter-btns .btn.active { background: #2563eb; color: #fff; }

    .post-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .post-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .post-author-info { display: flex; align-items: center; gap: 10px; }
    .avatar-sm {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .avatar-lg {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .presence-pin {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    .dot-online { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
    .dot-offline { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .status-sub { font-size: 12px; color: #64748b; }

    .post-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .post-body { font-size: 14px; line-height: 1.5; margin-bottom: 8px; white-space: pre-wrap; }
    .post-img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }

    .post-actions {
      display: flex;
      gap: 6px;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      padding: 6px 0;
      margin-bottom: 8px;
    }
    .action-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 7px 4px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .action-btn.liked { color: #2563eb; background: #eff6ff; }

    .comments-box { background: #f8fafc; border-radius: 8px; padding: 8px; }
    .comment-item { font-size: 13px; padding: 4px 0; border-bottom: 1px solid #e2e8f0; }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-form { display: flex; gap: 6px; margin-top: 8px; }

    .person-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .person-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .chat-box { display: flex; flex-direction: column; height: 62vh; min-height: 340px; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      margin: 10px 0;
    }
    .msg-bubble {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 12px;
      background: #e2e8f0;
      color: #0f172a;
      align-self: flex-start;
      font-size: 14px;
    }
    .msg-bubble.mine { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg-meta { font-size: 11px; opacity: 0.8; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
    .chat-form { display: flex; gap: 8px; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; text-align: center; }
    .stat-box { background: #f8fafc; border-radius: 8px; padding: 10px; }
    .stat-num { font-size: 18px; font-weight: 800; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .nav-item {
      background: transparent;
      border: none;
      padding: 9px 4px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
    }
    .nav-item.active { color: #2563eb; background: #eff6ff; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 80;
      max-width: 92%;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Nesru Michael</div>
    <span id="cloud-badge" class="badge badge-local">Local Mode</span>
  </header>

  <main class="container">
    <!-- FEED VIEW -->
    <section id="view-feed" class="view active">
      <div class="card">
        <div class="filter-bar">
          <div>
            <strong>Barreeffama Haaraa</strong>
            <div class="muted">Akka: <span id="feed-user-tag">Seenaa (Guest)</span></div>
          </div>
          <div class="filter-btns">
            <button type="button" id="filter-all" class="btn btn-sm btn-outline active" onclick="setFeedFilter('all')">Hundaa</button>
            <button type="button" id="filter-following" class="btn btn-sm btn-outline" onclick="setFeedFilter('following')">Following</button>
          </div>
        </div>

        <form id="post-form" onsubmit="handleCreatePost(event)">
          <div class="form-group">
            <input type="text" id="post-title" placeholder="Mata-duree barreeffamaa..." required />
          </div>
          <div class="form-group">
            <textarea id="post-body" placeholder="Maal yaadaa jirtu?..." required></textarea>
          </div>
          <div class="form-group">
            <input type="url" id="post-image" placeholder="Linkii suuraa (https://...) - filannoo" />
          </div>
          <button type="submit" class="btn btn-primary">Maxxansi</button>
        </form>
      </div>

      <div id="posts-list"></div>
    </section>

    <!-- PEOPLE VIEW -->
    <section id="view-people" class="view">
      <div class="card">
        <h3 style="margin-bottom:8px;">Namoota (People & Friends)</h3>
        <input type="search" id="people-search" placeholder="Maqaa ykn email barbaadi..." oninput="renderPeople()" />
      </div>

      <div id="friend-requests-box" class="card hidden">
        <h4 style="margin-bottom:8px;">Gaaffii Hiriyummaa Dhufe</h4>
        <div id="friend-requests-list"></div>
      </div>

      <div id="people-list"></div>
    </section>

    <!-- CHAT VIEW -->
    <section id="view-chat" class="view">
      <div class="card chat-box">
        <div class="form-group" style="margin-bottom:6px;">
          <select id="chat-target-select" onchange="switchChatTarget(this.value)">
            <option value="">🌍 Chat Waliinii (Hundaa)</option>
          </select>
        </div>

        <div>
          <strong id="chat-room-title">Chat Waliinii (Public Group)</strong>
          <div id="chat-room-status" class="status-sub"><span class="dot-online"></span> 1 Online amma</div>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <form class="chat-form" onsubmit="handleSendMessage(event)">
          <input type="text" id="chat-input" placeholder="Ergaa barreessi..." required />
          <button type="submit" class="btn btn-primary">Ergi</button>
        </form>
      </div>
    </section>

    <!-- PROFILE & AUTH VIEW -->
    <section id="view-auth" class="view">
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;">
          <div id="profile-avatar" class="avatar-lg">NM</div>
          <div>
            <h3 id="profile-name">Nesru Michael</h3>
            <div id="profile-email" class="muted">nesrumichael@gmail.com</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div id="stat-posts" class="stat-num">0</div>
            <div class="muted">Posts</div>
          </div>
          <div class="stat-box">
            <div id="stat-followers" class="stat-num">0</div>
            <div class="muted">Followers</div>
          </div>
          <div class="stat-box">
            <div id="stat-friends" class="stat-num">0</div>
            <div class="muted">Friends</div>
          </div>
        </div>

        <button type="button" class="btn btn-outline btn-sm" onclick="handleLogout()">Ba'i (Logout)</button>
      </div>

      <div class="card">
        <div class="auth-tabs">
          <button type="button" id="btn-show-login" class="btn btn-outline active" onclick="switchAuthMode('login')">Seeni</button>
          <button type="button" id="btn-show-register" class="btn btn-outline" onclick="switchAuthMode('register')">Akkaawuntii Uumi</button>
        </div>

        <form onsubmit="handleAuthSubmit(event)">
          <div id="field-name" class="form-group hidden">
            <label for="auth-name">Maqaa Guutuu</label>
            <input type="text" id="auth-name" placeholder="Maqaa keessan galchaa" />
          </div>
          <div class="form-group">
            <label for="auth-email">Email</label>
            <input type="email" id="auth-email" placeholder="example@gmail.com" required />
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" placeholder="Password galchaa" required />
          </div>
          <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width:100%;justify-content:center;">Seeni</button>
        </form>
      </div>

      <div class="card">
        <h4 style="margin-bottom:8px;">Qindaa'ina Supabase</h4>
        <div class="form-group">
          <label for="sb-url">Supabase Project URL</label>
          <input type="url" id="sb-url" placeholder="https://xxxx.supabase.co" />
        </div>
        <div class="form-group">
          <label for="sb-key">Supabase Anon Key</label>
          <input type="text" id="sb-key" placeholder="eyJ..." />
        </div>
        <button type="button" class="btn btn-success btn-sm" onclick="saveSupabaseConfig()">Qindaa'ina Ol-kaa'i</button>
      </div>
    </section>
  </main>

  <!-- PUBLIC PROFILE MODAL -->
  <div id="public-profile-modal" class="modal-backdrop hidden" onclick="if(event.target===this) closePublicProfile()">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="pub-prof-name">Profile</h3>
        <button type="button" class="btn btn-outline btn-sm" onclick="closePublicProfile()">✕ Cufi</button>
      </div>
      <div id="pub-prof-content"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <nav class="bottom-nav">
    <button type="button" class="nav-item active" data-target="view-feed" onclick="navigateTo('view-feed')">📰 Feed</button>
    <button type="button" class="nav-item" data-target="view-people" onclick="navigateTo('view-people')">👥 People</button>
    <button type="button" class="nav-item" data-target="view-chat" onclick="navigateTo('view-chat')">💬 Chat</button>
    <button type="button" class="nav-item" data-target="view-auth" onclick="navigateTo('view-auth')">👤 Profile</button>
  </nav>

  <script src="./app.js"></script>
</body>
</html>
